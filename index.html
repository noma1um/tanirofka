<!DOCTYPE html>
<html lang="uz" class="dark scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREMIUM TINT — Luxury Automotive Window Tinting & Detailing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script>
        // Tailwind CSS konfiguratsiyasi (qora-oltin uslub va maxsus shriftlar)
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        brand: ['Cinzel', 'Georgia', 'serif'],
                    },
                    colors: {
                        obsidian: '#0B0B0D',
                        charcoal: '#131318',
                        graphite: '#1B1B22',
                        gold: {
                            light: '#F5D77F',
                            DEFAULT: '#D4AF37',
                            dark: '#9E7E1E',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex flex-col selection:bg-gold selection:text-obsidian">

    <!-- Toast xabarnoma konteyneri -->
    <div id="toastContainer"
        class="fixed bottom-5 right-5 z-[100] flex flex-col gap-2 max-w-sm w-full pointer-events-none px-3 sm:px-0">
    </div>

    <!-- Yuqori navigatsiya paneli -->
    <header class="sticky top-0 z-50 bg-[#0B0B0D]/92 backdrop-blur-md border-b border-white/10">
        <div
            class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-2 sm:gap-3">
            <!-- Brend so'z belgisi: 5-6 marta bosilganda Admin panelga o'tadi -->
            <button type="button" id="brandSecretTrigger" onclick="handleBrandSecretTap()" title="PREMIUM TINT"
                class="flex flex-col justify-center items-start text-left group shrink-0 min-h-[44px] pr-1 focus:outline-none">
                <div class="text-base sm:text-xl font-extrabold gold-gradient-text leading-none brand-wordmark">PREMIUM
                    TINT</div>
                <div class="text-[10px] sm:text-[11px] uppercase tracking-[0.18em] text-gray-300 mt-1">06:00 — 22:00
                </div>
            </button>

            <!-- Katta ekran menyusi -->
            <nav class="hidden lg:flex items-center gap-6 text-sm font-semibold text-gray-200">
                <a href="#home" onclick="navigateTo('home', event)" class="nav-link hover:text-gold transition py-2"
                    data-i18n="nav_home">Asosiy</a>
                <a href="#simulator" onclick="navigateTo('simulator', event)"
                    class="nav-link hover:text-gold transition py-2" data-i18n="nav_sim">Simulyator & Kalkulyator</a>
                <a href="#booking" onclick="navigateTo('booking', event)"
                    class="nav-link hover:text-gold transition py-2" data-i18n="nav_book">Bron qilish</a>
                <a href="#queue" onclick="navigateTo('queue', event)"
                    class="nav-link hover:text-gold transition py-2 flex items-center gap-1.5" data-i18n="nav_queue">
                    Navbatdagi mashinalar
                    <span id="headerQueueBadge"
                        class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-gold/20 text-gold border border-gold/30">0</span>
                </a>
                <a href="#reviews" onclick="navigateTo('reviews', event)"
                    class="nav-link hover:text-gold transition py-2" data-i18n="nav_reviews">Sharhlar</a>
            </nav>

            <!-- O'ng tomon: Til almashtirish va Bron qilish tugmasi -->
            <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                <div class="flex items-center bg-charcoal border border-white/15 rounded-xl p-0.5 text-xs font-bold">
                    <button type="button" id="langUzBtn" onclick="setLanguage('uz')"
                        class="px-2.5 py-2 min-h-[36px] rounded-[10px] transition bg-gold text-obsidian">UZ</button>
                    <button type="button" id="langRuBtn" onclick="setLanguage('ru')"
                        class="px-2.5 py-2 min-h-[36px] rounded-[10px] transition text-gray-300 hover:text-white">RU</button>
                </div>

                <button type="button" onclick="navigateTo('booking')"
                    class="hidden sm:inline-flex items-center justify-center gold-btn px-4 py-2.5 min-h-[40px] rounded-xl text-xs font-extrabold tracking-wide"
                    data-i18n="cta_book_now">
                    Bron qilish
                </button>
            </div>
        </div>

        <!-- Mobil gorizontal menyu -->
        <div
            class="lg:hidden border-t border-white/10 bg-[#0E0E12] px-2.5 py-2 flex items-center gap-2 overflow-x-auto text-xs sm:text-sm font-semibold">
            <button type="button" onclick="navigateTo('home')"
                class="px-3.5 py-2 min-h-[40px] rounded-xl bg-white/10 hover:bg-gold/20 text-white whitespace-nowrap transition"
                data-i18n="nav_home">Asosiy</button>
            <button type="button" onclick="navigateTo('simulator')"
                class="px-3.5 py-2 min-h-[40px] rounded-xl bg-white/10 hover:bg-gold/20 text-white whitespace-nowrap transition"
                data-i18n="nav_sim_short">Simulyator</button>
            <button type="button" onclick="navigateTo('booking')"
                class="px-3.5 py-2 min-h-[40px] rounded-xl bg-gold/20 border border-gold/40 text-gold-light whitespace-nowrap transition"
                data-i18n="nav_book">Bron qilish</button>
            <button type="button" onclick="navigateTo('queue')"
                class="px-3.5 py-2 min-h-[40px] rounded-xl bg-white/10 hover:bg-gold/20 text-white whitespace-nowrap transition"
                data-i18n="nav_queue_short">Navbatdagi mashinalar</button>
            <button type="button" onclick="navigateTo('reviews')"
                class="px-3.5 py-2 min-h-[40px] rounded-xl bg-white/10 hover:bg-gold/20 text-white whitespace-nowrap transition"
                data-i18n="nav_reviews">Sharhlar</
